name: collect
run-name: collect (${{ github.event_name == 'schedule' && 'gha-cron' || 'manual' }})

# Wikivoyage listings change slowly; weekly is plenty and keeps us polite to Wikimedia.
on:
  schedule:
    - cron: "17 19 * * 0"   # Sunday 19:17 UTC = Monday 03:17 SGT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # SEA ~23 min + East Asia 28.6 min uncached (measured 2026-10-14); headroom for 429 retries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Build
        id: build
        # exit 1 = some countries failed and kept last week's file: still commit the rest,
        # then go red in the last step so the failure emails you (a green partial run is silent).
        # exit 2 = nothing built: fail the run, write nothing.
        run: |
          set +e
          python -m ulu.build
          rc=$?
          echo "build rc=$rc"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat data/state.json
          if [ "$rc" = "2" ]; then exit 1; fi
          exit 0
      - name: Commit
        # Vercel deploys only commits authored by the project owner: an "ulu-collector" author was
        # BLOCKED, and so was a deploy hook (it checks the HEAD commit's author too), measured
        # 2026-10-15. So the data commit is authored as the owner, via GitHub's private noreply address.
        run: |
          git config user.name "Zhi Yang"
          git config user.email "61216405+Zhiyang123@users.noreply.github.com"
          git add public/data data/state.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: weekly collect $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail if any country failed
        # After the commit, so the countries that built still ship. Names them in the email.
        if: steps.build.outputs.rc == '1'
        run: |
          python3 -c "import json; s=json.load(open('data/state.json', encoding='utf-8')); [print('::error title=country failed::' + k + ': ' + str(v)[:200]) for k, v in s['failed'].items()]"
          exit 1
